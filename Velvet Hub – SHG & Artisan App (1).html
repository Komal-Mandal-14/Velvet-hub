<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velvet Hub – SHG & Artisan App</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#1a0a2e;--bg2:#4a1a7a;--card:rgba(255,255,255,.07);--ink:#f1eaff;--mut:#b9a8d6;--gold:#c9a7ff;--gold2:#8b5cf6;--line:rgba(190,150,255,.3);--ok:#8fd694;--bad:#ff9d8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:17px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(circle at 15% 0%,var(--bg2),var(--bg) 62%) fixed,repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 2px,transparent 2px 4px);background-color:var(--bg)}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:88px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:linear-gradient(135deg,#5b21b6,#2e1065);border-bottom:2px solid var(--gold)}
header h1{margin:0;font-size:21px;color:var(--gold);letter-spacing:.5px}header small{display:block;color:var(--mut);font-size:12px}
header select{padding:6px;border-radius:8px;border:1px solid var(--gold);background:#2e1065;color:var(--ink)}
main{padding:14px}h2{font-size:19px;margin:8px 0 12px;color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 8px;text-align:center;font-weight:600;cursor:pointer;backdrop-filter:blur(4px)}
.tile span{display:block;font-size:32px;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mut{color:var(--mut);font-size:14px}
.stat{text-align:center}.stat b{display:block;font-size:22px;color:var(--gold)}
input,select.f,textarea{width:100%;padding:12px;font:inherit;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.25);color:var(--ink);margin-bottom:8px}
.btn{background:linear-gradient(#c9a7ff,#8b5cf6);color:#1a0a2e;border:0;border-radius:12px;padding:12px 16px;font:600 17px inherit;cursor:pointer}
.btn.alt{background:rgba(190,150,255,.15);color:var(--gold);border:1px solid var(--line)}.btn.sm{padding:8px 12px;font-size:15px}
.tag{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;background:rgba(190,150,255,.2);color:var(--gold)}
.in{color:var(--ok)}.out{color:var(--bad)}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
nav{position:fixed;bottom:0;left:0;right:0;background:#1a0a2e;border-top:2px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:480px;margin:0 auto;display:flex}nav button{flex:1;background:none;border:0;padding:8px 0;font-size:11px;color:var(--mut);cursor:pointer}
nav button span{display:block;font-size:22px}nav button.on{color:var(--gold);font-weight:700}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--gold);color:#1a0a2e;padding:10px 16px;border-radius:99px;font-weight:600;display:none}
.pc{border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;background:var(--card)}
.mic{width:auto;flex:none;margin:0}
</style></head><body>
<div id="app"><header><div><h1>💎 Velvet Hub</h1><small id="sub"></small></div>
<select id="lang" onchange="setLang(this.value)"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option></select></header>
<main id="main"></main><nav><div id="nav"></div></nav></div><div class="toast" id="toast"></div>
<script>
const L={en:{home:'Home',products:'Products',orders:'Orders',money:'Money',more:'More',sub:'Marketing · Payments · Visibility',addp:'Add Product',name:'Product name',price:'Price (₹)',save:'Save',share:'Share',
neworder:'New Order',buyer:'Buyer name',qty:'Quantity',status:'Next status',s0:'New',s1:'Making',s2:'Ready',s3:'Delivered',paid:'Paid',due:'Payment due',pay:'Send UPI link',mark:'Received',
ledger:'Group Ledger',income:'Income',expense:'Expense',amount:'Amount',note:'Note',add:'Add',upi:'Group UPI ID',bal:'Balance',pending:'Pending payments',none:'Nothing yet',saved:'Saved!',
sales:'Total sales',recv:'Received',prods:'Products',ords:'Orders',profile:'Group Profile',store:'Buyer Store View',survey:'Needs Survey',learn:'Learn',help:'Help',
pricehelp:'Price Helper',cost:'Material cost (₹)',hrs:'Hours of work',rate:'Your hourly rate (₹)',profit:'Profit %',sugg:'Suggested price',use:'Use this price',gname:'Group / artisan name',loc:'Location',craft:'Craft',story:'Our story',
order:'Order on WhatsApp',submit:'Submit response',resp:'responses',stitle:'Field survey (fill during interviews)',
hint:'Tap a big icon to start'},
hi:{home:'होम',products:'उत्पाद',orders:'ऑर्डर',money:'पैसा',more:'और',sub:'मार्केटिंग · पेमेंट · पहचान',addp:'उत्पाद जोड़ें',name:'उत्पाद का नाम',price:'कीमत (₹)',save:'सेव',share:'भेजें',neworder:'नया ऑर्डर',buyer:'खरीदार का नाम',qty:'मात्रा',status:'अगली स्थिति',s0:'नया',s1:'बन रहा',s2:'तैयार',s3:'दे दिया',paid:'पैसे मिले',due:'पैसे बाकी',pay:'UPI लिंक भेजें',mark:'मिल गए',ledger:'समूह खाता',income:'आमदनी',expense:'खर्च',amount:'रकम',note:'नोट',add:'जोड़ें',bal:'बचत',pending:'बाकी पैसे',none:'अभी कुछ नहीं',saved:'सेव हो गया!',sales:'कुल बिक्री',recv:'मिले',prods:'उत्पाद',ords:'ऑर्डर',profile:'समूह प्रोफाइल',store:'खरीदार दुकान',survey:'ज़रूरत सर्वे',learn:'सीखें',help:'मदद',pricehelp:'कीमत सहायक',sugg:'सुझाई कीमत',use:'यह कीमत लगाएँ',order:'व्हाट्सएप पर ऑर्डर',hint:'शुरू करने के लिए बड़े आइकन दबाएँ'},
mr:{home:'होम',products:'उत्पादने',orders:'ऑर्डर',money:'पैसे',more:'अधिक',sub:'मार्केटिंग · पेमेंट · ओळख',addp:'उत्पादन जोडा',name:'उत्पादनाचे नाव',price:'किंमत (₹)',save:'सेव्ह',share:'पाठवा',neworder:'नवीन ऑर्डर',buyer:'खरेदीदाराचे नाव',qty:'संख्या',status:'पुढची स्थिती',s0:'नवीन',s1:'तयार होत आहे',s2:'तयार',s3:'दिले',paid:'पैसे मिळाले',due:'पैसे बाकी',pay:'UPI लिंक पाठवा',mark:'मिळाले',ledger:'गटाचा हिशोब',income:'उत्पन्न',expense:'खर्च',amount:'रक्कम',note:'नोंद',add:'जोडा',bal:'शिल्लक',pending:'बाकी पैसे',none:'अजून काही नाही',saved:'सेव्ह झाले!',sales:'एकूण विक्री',recv:'मिळाले',prods:'उत्पादने',ords:'ऑर्डर',profile:'गट प्रोफाइल',store:'खरेदीदार दुकान',survey:'गरज सर्वे',learn:'शिका',help:'मदत',pricehelp:'किंमत मदतनीस',sugg:'सुचवलेली किंमत',use:'ही किंमत वापरा',order:'व्हॉट्सॲपवर ऑर्डर',hint:'सुरू करण्यासाठी मोठा आयकॉन दाबा'}};
const Qs=[['Where do you mainly sell?',['Local customers','Exhibitions','Middlemen','WhatsApp / online']],['How do you mostly get paid?',['Cash','UPI','Bank transfer']],['Do buyers pay late?',['Often','Sometimes','Never']],
['Do you own a smartphone?',['Own','Shared','No']],['Easiest language on phone?',['Marathi','Hindi','English']],['Keep sales records?',['Written','Phone','No record']],['Attend app training?',['Yes','No','Not sure']]];
const Lessons=[['📸 Take a good product photo',['Use daylight near a window','Plain cloth as background','Hold phone steady, show full item','Take one close-up of the design']],['💸 Receive UPI safely',['Check the SMS or app alert, not the customer screen','Never share your PIN or OTP','Match amount before handing over goods','Note the payment in the Money tab']],['💰 Set a fair price',['Add material cost','Add your hours × hourly rate','Add 15–30% profit','Use the Price Helper in Products']],['💬 Sell on WhatsApp',['Share product card with price','Reply within the day','Send UPI link for advance','Ask buyers to share your card with friends']]];
let lang='en',tab='home',pend=0;
const def={upi:'mygroup@upi',prof:{g:'Sakhi Self-Help Group',l:'MIDC, Andheri East, Mumbai',c:'Handmade jewellery',s:'Women artisans keeping tribal craft alive.',ph:''},
products:[],
orders:[],
ledger:[{t:'in',a:2400,n:'Exhibition sale'},{t:'out',a:600,n:'Raw material'}],survey:[]};
let S;try{S=JSON.parse(localStorage.getItem('kh'))||def}catch(e){S=def}
if(S.prof&&/Mira Road/.test(S.prof.l))S.prof.l=def.prof.l;
if(S.prof&&S.prof.c=='Warli art & bamboo craft')S.prof.c=def.prof.c;
const oldP=['Warli painting','Bamboo basket'];S.products=S.products.filter(p=>!oldP.includes(p.n));S.orders=S.orders.filter(o=>!oldP.includes(o.i));
function save(){try{localStorage.setItem('kh',JSON.stringify(S))}catch(e){}}
const t=k=>L[lang][k]||L.en[k]||k,$=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const e=$('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',1700)};
const setLang=v=>{lang=v;document.documentElement.lang=v;render()},go=x=>{tab=x;render()};
const wa=x=>window.open('https://wa.me/?text='+encodeURIComponent(x),'_blank');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const mic=id=>SR?`<button class="btn alt mic" type="button" onclick="listen('${id}')">🎤</button>`:'';
function listen(id){const r=new SR();r.lang={en:'en-IN',hi:'hi-IN',mr:'mr-IN'}[lang];r.onresult=e=>{$(id).value=e.results[0][0].transcript};r.start()}
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);

function home(){const sales=sum(S.orders,o=>o.amt),got=sum(S.orders.filter(o=>o.paid),o=>o.amt);
return `<p class="mut">${t('hint')}</p><div class="grid">
<div class="tile" onclick="go('products')"><span>🎨</span>${t('products')}</div><div class="tile" onclick="go('orders')"><span>📦</span>${t('orders')}</div>
<div class="tile" onclick="go('money')"><span>💰</span>${t('money')}</div><div class="tile" onclick="go('store')"><span>🛍️</span>${t('store')}</div>
<div class="tile" onclick="go('survey')"><span>📋</span>${t('survey')}</div><div class="tile" onclick="go('learn')"><span>🎓</span>${t('learn')}</div></div>
<h2 style="margin-top:16px">${esc(S.prof.g)}</h2><div class="grid">
<div class="card stat"><b>₹${sales}</b>${t('sales')}</div><div class="card stat"><b>₹${got}</b>${t('recv')}</div>
<div class="card stat"><b>₹${sales-got}</b>${t('pending')}</div><div class="card stat"><b>${S.products.length}</b>${t('prods')}</div><div class="card stat"><b>${S.orders.length}</b>${t('ords')}</div>
<div class="card stat"><b>₹${sum(S.ledger.filter(x=>x.t=='in'),x=>x.a)-sum(S.ledger.filter(x=>x.t=='out'),x=>x.a)}</b>${t('bal')}</div></div>`}

function products(){return `<h2>${t('addp')}</h2><div class="card">
<div class="row"><input id="pn" placeholder="${t('name')}">${mic('pn')}</div><div class="row"><input id="pp" type="number" inputmode="numeric" placeholder="${t('price')}"></div><input id="pl" placeholder="${t('loc')} (${S.prof.l})">
<input id="pi" type="file" accept="image/*" capture="environment"><button class="btn" onclick="addP()">${t('save')}</button></div>
<h2>${t('pricehelp')}</h2><div class="card"><input id="c1" type="number" placeholder="${t('cost')}" oninput="calc()"><input id="c2" type="number" placeholder="${t('hrs')}" oninput="calc()">
<input id="c3" type="number" placeholder="${t('rate')}" value="50" oninput="calc()"><input id="c4" type="number" placeholder="${t('profit')}" value="20" oninput="calc()">
<div class="row"><b>${t('sugg')}: <span id="sg">₹0</span></b><button class="btn alt sm" onclick="$('pp').value=window.sg||''">${t('use')}</button></div></div>
${S.products.map((p,i)=>`<div class="card row"><div style="display:flex;gap:10px;align-items:center">${p.img?`<img src="${p.img}" width="56" height="56" style="border-radius:10px;object-fit:cover" alt="">`:'<span style="font-size:34px">🖼️</span>'}
<div><b>${esc(p.n)}</b><div class="mut">₹${p.p} · 📍 ${esc(p.loc||S.prof.l)}</div></div></div><div style="display:flex;gap:6px"><button class="btn sm" onclick="shareP(${i})">💬 ${t('share')}</button><button class="btn alt sm" onclick="delP(${i})">🗑️</button></div></div>`).join('')}`}
function calc(){const v=i=>+$(i).value||0;window.sg=Math.round((v('c1')+v('c2')*v('c3'))*(1+v('c4')/100));$('sg').textContent='₹'+window.sg}
function addP(){const n=$('pn').value.trim(),p=+$('pp').value,loc=$('pl').value.trim();if(!n||!p)return;const f=$('pi').files[0];
const put=img=>{S.products.unshift({n,p,img,loc});save();toast(t('saved'));render()};if(f){const r=new FileReader();r.onload=()=>shrink(r.result,put);r.readAsDataURL(f)}else put('')}
const dataFile=(u,n)=>{const[h,b]=u.split(','),m=h.match(/:(.*?);/)[1],s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new File([a],n+'.jpg',{type:m})};
const shrink=(u,cb)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};im.src=u};
const card=(p,loc)=>new Promise(res=>{const im=new Image();im.onload=()=>{const W=1080,k=Math.min(W/im.width,1350/im.height),w=im.width*k,h=im.height*k,B=515,c=document.createElement('canvas');c.width=W;c.height=Math.round(h)+B;const x=c.getContext('2d');
x.fillStyle='#1a0a2e';x.fillRect(0,0,W,c.height);x.imageSmoothingQuality='high';x.drawImage(im,(W-w)/2,0,w,h);
const y=Math.round(h);x.textBaseline='alphabetic';x.font='bold 56px system-ui,sans-serif';x.fillStyle='#c9a7ff';x.fillText(p.n,40,y+85,1000);
x.font='bold 52px system-ui,sans-serif';x.fillStyle='#8fd694';x.fillText('₹'+p.p,40,y+155);
x.font='36px system-ui,sans-serif';x.fillStyle='#f1eaff';x.fillText('Handmade by '+S.prof.g,40,y+220,1000);x.fillText('📍 '+loc,40,y+275,1000);x.fillText('💎 '+S.prof.c,40,y+330,1000);x.fillText('📞 Order on WhatsApp: '+(S.prof.ph||'reply here'),40,y+385,1000);
x.fillStyle='rgba(201,167,255,.18)';x.fillRect(30,y+425,1020,68);x.fillStyle='#c9a7ff';x.font='bold 38px system-ui,sans-serif';x.fillText('💸 Pay by UPI: '+S.upi,50,y+472,980);
c.toBlob(b=>res(new File([b],'product.jpg',{type:'image/jpeg'})),'image/jpeg',.92)};im.src=p.img});
const delP=i=>{S.products.splice(i,1);save();toast('Deleted');render()};
const delO=i=>{S.orders.splice(i,1);save();toast('Deleted');render()};
const orderW=i=>{const x=S.products[i],d=(S.prof.ph||'').replace(/\D/g,''),n=d.length==10?'91'+d:d;
window.open('https://wa.me/'+n+'?text='+encodeURIComponent(`Hello ${S.prof.g}, I want to order:\n${x.n} (₹${x.p})\nQuantity: 1\nMy name: \nAddress: `),'_blank')};
const shareP=async i=>{const p=S.products[i],loc=p.loc||S.prof.l,txt=`💎 ${p.n} – ₹${p.p}\nHandmade by ${S.prof.g}, ${loc}.\nCraft: ${S.prof.c}\n💸 Pay by UPI: ${S.upi}\n📞 Order on WhatsApp: ${S.prof.ph||'reply here'}\nSend: your name, quantity, address.`;
try{if(p.img){const f=await card(p,loc);if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}}catch(e){if(e.name==='AbortError')return}
if(p.img)toast('Photo attach karne ke liye phone browser use karein');wa(txt)};

function orders(){return `<h2>${t('neworder')}</h2><div class="card"><input id="ob" placeholder="${t('buyer')}">
<select class="f" id="oi">${S.products.map(p=>`<option value="${esc(p.n)}|${p.p}">${esc(p.n)} – ₹${p.p}</option>`).join('')}</select>
<input id="oq" type="number" value="1" placeholder="${t('qty')}"><button class="btn" onclick="addO()">${t('add')}</button></div>
${S.orders.map((o,i)=>`<div class="card"><div class="row"><b>${esc(o.b)}</b><span class="tag">${t('s'+o.st)}</span></div>
<div class="mut">${esc(o.i)} × ${o.q} = ₹${o.amt} · ${o.paid?'✅ '+t('paid'):'⏳ '+t('due')}</div>
<div class="row" style="margin-top:8px"><button class="btn alt sm" onclick="nextS(${i})">➡️ ${t('status')}</button><button class="btn alt sm" onclick="delO(${i})">🗑️</button>${o.paid?'':`<button class="btn sm" onclick="payO(${i})">💸 ${t('pay')}</button>`}</div></div>`).join('')}`}
function addO(){const b=$('ob').value.trim();if(!b||!S.products.length)return;const[i,p]=$('oi').value.split('|'),q=+$('oq').value||1;S.orders.unshift({b,i,q,amt:q*p,st:0,paid:false});save();toast(t('saved'));render()}
const nextS=i=>{S.orders[i].st=(S.orders[i].st+1)%4;save();render()};
function payO(i){const o=S.orders[i];wa(`Namaste ${o.b}, payment ₹${o.amt} for ${o.i}.\nPay by UPI: upi://pay?pa=${S.upi}&pn=${encodeURIComponent(S.prof.g)}&am=${o.amt}&cu=INR\nUPI ID: ${S.upi}`)}

function money(){const inc=sum(S.ledger.filter(x=>x.t=='in'),x=>x.a),out=sum(S.ledger.filter(x=>x.t=='out'),x=>x.a),pd=S.orders.filter(o=>!o.paid);
return `<h2>${t('pending')}</h2>${pd.length?pd.map(o=>`<div class="card row"><div><b>${esc(o.b)}</b><div class="mut">₹${o.amt}</div></div><button class="btn sm" onclick="recv(${S.orders.indexOf(o)})">✅ ${t('mark')}</button></div>`).join(''):`<p class="mut">${t('none')}</p>`}
<h2>${t('ledger')}</h2><div class="card row"><span class="in">${t('income')} ₹${inc}</span><span class="out">${t('expense')} ₹${out}</span><b>${t('bal')} ₹${inc-out}</b></div>
<div class="card"><select class="f" id="lt"><option value="in">${t('income')}</option><option value="out">${t('expense')}</option></select><input id="la" type="number" placeholder="${t('amount')}"><input id="ln" placeholder="${t('note')}"><button class="btn" onclick="addL()">${t('add')}</button></div>
${S.ledger.map(x=>`<div class="card row"><span>${esc(x.n)}</span><b class="${x.t}">${x.t=='in'?'+':'−'}₹${x.a}</b></div>`).join('')}
<div class="card"><label class="mut">${t('upi')}</label><input value="${esc(S.upi)}" onchange="S.upi=this.value.trim();save()"></div>`}
const recv=i=>{const o=S.orders[i];o.paid=true;S.ledger.unshift({t:'in',a:o.amt,n:o.b+' – '+o.i});save();toast(t('saved'));render()};
function addL(){const a=+$('la').value;if(!a)return;S.ledger.unshift({t:$('lt').value,a,n:$('ln').value||'-'});save();render()}

function store(){const p=S.prof;return `<div class="card" style="text-align:center"><h2 style="margin:0">${esc(p.g)}</h2><div class="mut">📍 ${esc(p.l)} · ${esc(p.c)}</div><p>${esc(p.s)}</p><div class="tag">💸 UPI: ${esc(S.upi)}</div></div>
<div class="grid">${S.products.map((x,i)=>`<div class="pc">${x.img?`<img src="${x.img}" style="width:100%;height:auto;max-height:240px;object-fit:contain;border-radius:10px" alt="">`:'<div style="font-size:54px">🖼️</div>'}<b>${esc(x.n)}</b><div class="in">₹${x.p}</div>
<button class="btn sm" style="margin-top:6px" onclick="orderW(${i})">${t('order')}</button></div>`).join('')}</div>`}
function profile(){const p=S.prof;return `<h2>${t('profile')}</h2><div class="card"><input id="g1" value="${esc(p.g)}" placeholder="${t('gname')}"><input id="g2" value="${esc(p.l)}" placeholder="${t('loc')}"><input id="g3" value="${esc(p.c)}" placeholder="${t('craft')}">
<input id="g5" type="tel" value="${esc(p.ph||'')}" placeholder="WhatsApp number (10 digits)"><textarea id="g4" rows="3" placeholder="${t('story')}">${esc(p.s)}</textarea><button class="btn" onclick="saveProf()">${t('save')}</button> <button class="btn alt" onclick="wa('${esc(p.g)} – ${esc(p.c)}, ${esc(p.l)}. ${esc(p.s)}')">💬 ${t('share')}</button></div>`}
function saveProf(){S.prof={g:$('g1').value,l:$('g2').value,c:$('g3').value,s:$('g4').value,ph:$('g5').value.trim()};save();toast(t('saved'));render()}

function survey(){const n=S.survey.length;return `<h2>${t('survey')}</h2><p class="mut">${t('stitle')}</p><div class="card">${Qs.map((q,i)=>`<label class="mut">${i+1}. ${q[0]}</label><select class="f" id="sq${i}">${q[1].map((o,j)=>`<option value="${j}">${o}</option>`).join('')}</select>`).join('')}
<button class="btn" onclick="subS()">${t('submit')}</button></div><h2>${n} ${t('resp')}</h2>
${n?Qs.map((q,i)=>`<div class="card"><b>${q[0]}</b>${q[1].map((o,j)=>{const c=S.survey.filter(r=>r[i]==j).length,pc=Math.round(c*100/n);return `<div class="row mut"><span>${o}</span><span>${c} (${pc}%)</span></div><div class="bar"><i style="width:${pc}%"></i></div>`}).join('')}</div>`).join(''):`<p class="mut">${t('none')}</p>`}`}
function subS(){S.survey.push(Qs.map((q,i)=>+$('sq'+i).value));save();toast(t('saved'));render()}

function learn(){return `<h2>${t('learn')}</h2>${Lessons.map(l=>`<div class="card"><b>${l[0]}</b><ol class="mut" style="margin:6px 0 0;padding-left:20px">${l[1].map(s=>`<li>${s}</li>`).join('')}</ol></div>`).join('')}`}
function more(){return `<h2>${t('more')}</h2><div class="grid"><div class="tile" onclick="go('profile')"><span>👥</span>${t('profile')}</div><div class="tile" onclick="go('store')"><span>🛍️</span>${t('store')}</div>
<div class="tile" onclick="go('survey')"><span>📋</span>${t('survey')}</div><div class="tile" onclick="go('learn')"><span>🎓</span>${t('learn')}</div></div>`}

function render(){$('sub').textContent=t('sub');$('main').innerHTML=({home,products,orders,money,more,store,profile,survey,learn})[tab]();
const nv=[['home','🏠'],['products','🎨'],['orders','📦'],['money','💰'],['more','☰']],cur=nv.some(x=>x[0]==tab)?tab:'more';
$('nav').innerHTML=nv.map(([k,e])=>`<button class="${cur==k?'on':''}" onclick="go('${k}')"><span>${e}</span>${t(k)}</button>`).join('')}
render();
</script></body></html>
